name: Build macOS

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Install frontend dependencies
        run: npm install
        working-directory: frontend

      - name: Import Code Signing Certificate
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          CERTIFICATE_PATH=$RUNNER_TEMP/certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)

          echo -n "$APPLE_CERTIFICATE_BASE64" | base64 --decode -o $CERTIFICATE_PATH

          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          security import $CERTIFICATE_PATH -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH

      - name: Get version
        id: version
        run: |
          VERSION=$(git describe --tags --always --dirty 2>/dev/null || echo "dev")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Build macOS Universal Binary
        run: |
          wails build -platform darwin/universal -ldflags "-X main.version=${{ steps.version.outputs.version }}"

      - name: Code Sign Application
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          APP_PATH="build/bin/reManager.app"

          codesign --deep --force --verify --verbose \
            --sign "Developer ID Application: Robert Scott ($APPLE_TEAM_ID)" \
            --options runtime \
            --entitlements build/darwin/entitlements.plist \
            "$APP_PATH"

          codesign --verify --verbose "$APP_PATH"

      - name: Create ZIP for Notarization
        run: |
          cd build/bin
          ditto -c -k --keepParent reManager.app reManager-macos-universal.zip

      - name: Set up Notarization Credentials
        env:
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
        run: |
          mkdir -p ~/private_keys
          echo -n "$APPLE_API_KEY_BASE64" | base64 --decode -o ~/private_keys/AuthKey_$APPLE_API_KEY_ID.p8

      - name: Notarize Application
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          xcrun notarytool submit build/bin/reManager-macos-universal.zip \
            --key ~/private_keys/AuthKey_$APPLE_API_KEY_ID.p8 \
            --key-id $APPLE_API_KEY_ID \
            --issuer $APPLE_API_ISSUER_ID \
            --wait

      - name: Staple Notarization Ticket
        run: |
          xcrun stapler staple build/bin/reManager.app

      - name: Create Final ZIP
        run: |
          cd build/bin
          rm reManager-macos-universal.zip
          ditto -c -k --keepParent reManager.app reManager-macos-universal.zip

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: reManager-macos-universal
          path: build/bin/reManager-macos-universal.zip

      - name: Upload to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: build/bin/reManager-macos-universal.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
